<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>WOS 전투 최적화 계산기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔥 WOS 전투 최적화 계산기</h1>
<p class="subtitle">실제 게임 스탯 입력 → 최적 병종 비율 & 영웅 자동 계산</p>

<section class="card">
  <label>
    <input type="checkbox" id="enemyDefense" checked>
    적이 수성 중인가요?
  </label>
</section>

<!-- ================= 아군 ================= -->
<section class="card">
  <h2>아군 병력</h2>

  <label>
    총 병사 수
    <input id="our_total_count" type="number" placeholder="예: 1200000">
  </label>

  <h3>아군 병종별 최종 스탯 (%)</h3>
  <div class="grid">
    <div class="branch">
      <h4>방패병</h4>
      <input id="our_shield_atk" placeholder="공격력">
      <input id="our_shield_def" placeholder="방어력">
      <input id="our_shield_hp" placeholder="HP">
      <input id="our_shield_pow" placeholder="파괴력">
    </div>

    <div class="branch">
      <h4>창병</h4>
      <input id="our_spear_atk">
      <input id="our_spear_def">
      <input id="our_spear_hp">
      <input id="our_spear_pow">
    </div>

    <div class="branch">
      <h4>궁병</h4>
      <input id="our_archer_atk">
      <input id="our_archer_def">
      <input id="our_archer_hp">
      <input id="our_archer_pow">
    </div>
  </div>
</section>

<!-- ================= 적 ================= -->
<section class="card">
  <h2>적 병력</h2>

  <h3>병종별 병사 수</h3>
  <div class="grid">
    <div class="branch">
      <h4>방패병</h4>
      <input id="enemy_shield_count" placeholder="병사 수">
    </div>
    <div class="branch">
      <h4>창병</h4>
      <input id="enemy_spear_count">
    </div>
    <div class="branch">
      <h4>궁병</h4>
      <input id="enemy_archer_count">
    </div>
  </div>

  <h3>적 병종별 최종 스탯 (%)</h3>
  <div class="grid">
    <div class="branch">
      <h4>방패병</h4>
      <input id="enemy_shield_atk">
      <input id="enemy_shield_def">
      <input id="enemy_shield_hp">
      <input id="enemy_shield_pow">
    </div>

    <div class="branch">
      <h4>창병</h4>
      <input id="enemy_spear_atk">
      <input id="enemy_spear_def">
      <input id="enemy_spear_hp">
      <input id="enemy_spear_pow">
    </div>

    <div class="branch">
      <h4>궁병</h4>
      <input id="enemy_archer_atk">
      <input id="enemy_archer_def">
      <input id="enemy_archer_hp">
      <input id="enemy_archer_pow">
    </div>
  </div>
</section>

<button id="calcBtn">🚀 계산 실행</button>

<section class="card" id="resultBox" hidden>
  <h2>✅ 계산 결과</h2>
  <pre id="result"></pre>
</section>

<script src="app.js"></script>
</body>
</html>
