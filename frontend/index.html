<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>WOS 전투 최적화 계산기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  style.css
</head>
<body>

<h1>🔥 WOS 전투 최적화 계산기</h1>
<p class="subtitle">
  병과 수치 입력 → 최적 영웅 조합 & 병과 비율 자동 계산
</p>

<!-- ================= 전투 옵션 ================= -->
<section class="card">
  <h2>전투 조건</h2>
  <label>
    <input type="checkbox" id="enemyDefense" checked>
    적이 수성 중
  </label>

  <label>
    탐색 해상도
    <select id="step">
      <option value="0.01">1%</option>
      <option value="0.005">0.5%</option>
      <option value="0.001">0.1%</option>
    </select>
  </label>
</section>

<!-- ================= 아군 입력 ================= -->
<section class="card">
  <h2>아군 병력</h2>

  <div class="grid">
    <div class="branch">
      <h3>방패병</h3>
      <input id="our_shield_count" type="number" placeholder="병사 수">
      <input id="our_shield_tier" type="number" placeholder="단계">
      <input id="our_shield_fc" type="number" placeholder="FC">
      <input id="our_shield_atk" type="number" placeholder="공격력%">
      <input id="our_shield_def" type="number" placeholder="방어력%">
      <input id="our_shield_hp" type="number" placeholder="HP%">
    </div>

    <div class="branch">
      <h3>창병</h3>
      <input id="our_spear_count" type="number" placeholder="병사 수">
      <input id="our_spear_tier" type="number" placeholder="단계">
      <input id="our_spear_fc" type="number" placeholder="FC">
      <input id="our_spear_atk" type="number" placeholder="공격력%">
      <input id="our_spear_def" type="number" placeholder="방어력%">
      <input id="our_spear_hp" type="number" placeholder="HP%">
    </div>

    <div class="branch">
      <h3>궁병</h3>
      <input id="our_archer_count" type="number" placeholder="병사 수">
      <input id="our_archer_tier" type="number" placeholder="단계">
      <input id="our_archer_fc" type="number" placeholder="FC">
      <input id="our_archer_atk" type="number" placeholder="공격력%">
      <input id="our_archer_def" type="number" placeholder="방어력%">
      <input id="our_archer_hp" type="number" placeholder="HP%">
    </div>
  </div>
</section>

<!-- ================= 적 입력 ================= -->
<section class="card">
  <h2>적 병력</h2>

  <div class="grid">
    <div class="branch">
      <h3>방패병</h3>
      <input id="enemy_shield_count" type="number" placeholder="병사 수">
      <input id="enemy_shield_tier" type="number" placeholder="단계">
      <input id="enemy_shield_fc" type="number" placeholder="FC">
      <input id="enemy_shield_atk" type="number" placeholder="공격력%">
      <input id="enemy_shield_def" type="number" placeholder="방어력%">
      <input id="enemy_shield_hp" type="number" placeholder="HP%">
    </div>

    <div class="branch">
      <h3>창병</h3>
      <input id="enemy_spear_count" type="number" placeholder="병사 수">
      <input id="enemy_spear_tier" type="number" placeholder="단계">
      <input id="enemy_spear_fc" type="number" placeholder="FC">
      <input id="enemy_spear_atk" type="number" placeholder="공격력%">
      <input id="enemy_spear_def" type="number" placeholder="방어력%">
      <input id="enemy_spear_hp" type="number" placeholder="HP%">
    </div>

    <div class="branch">
      <h3>궁병</h3>
      <input id="enemy_archer_count" type="number" placeholder="병사 수">
      <input id="enemy_archer_tier" type="number" placeholder="단계">
      <input id="enemy_archer_fc" type="number" placeholder="FC">
      <input id="enemy_archer_atk" type="number" placeholder="공격력%">
      <input id="enemy_archer_def" type="number" placeholder="방어력%">
      <input id="enemy_archer_hp" type="number" placeholder="HP%">
    </div>
  </div>
</section>

<!-- ================= 실행 ================= -->
<button id="calcBtn">🚀 계산 실행</button>

<!-- ================= 결과 ================= -->
<section class="card" id="resultBox" hidden>
  <h2>✅ 결과</h2>

  <div id="resultHeroes"></div>
  <div id="resultRatio"></div>
  <div id="resultVerdict"></div>

  <pre id="resultSummary"></pre>
</section>

app.js
</body>
</html>
